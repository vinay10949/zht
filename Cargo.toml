[workspace]
resolver = "2"
members = [
    "crates/zht-proto",
    "crates/zht-common",
    "crates/zht-config",
    "crates/zht-client",
    "crates/zht-server",
    "crates/zht-cache",
    "crates/zht-storage",
    "crates/zht-transport",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "ZHT (Zero-Hop Distributed Hash Table)"
repository = "https://github.com/datasys/zht"

[workspace.dependencies]
# Protobuf
prost = "0.13"
prost-types = "0.13"
bytes = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Networking
socket2 = "0.6"

# Utilities
once_cell = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

# Dev dependencies
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
